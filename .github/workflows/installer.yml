name: Create portable release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build'
        required: true
        default: 'v2.x.x'
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Build portable zip
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          $version = $tag -replace '^v', ''
          $distDir = "PathOfBuilding-kor-${version}"

          # Create distribution directory
          New-Item -ItemType Directory -Path $distDir -Force

          # Copy runtime (exe, dlls, lua libs, fonts)
          Copy-Item -Path "runtime/*" -Destination $distDir -Recurse -Force

          # Copy source code - must be "src/" to match manifest.cfg path
          Copy-Item -Path "src" -Destination "$distDir/src" -Recurse -Force

          # Remove files not needed in distribution (per manifest.cfg exclude)
          $excludeFiles = @(
            "$distDir/src/HeadlessWrapper.lua",
            "$distDir/src/LaunchInstall.lua",
            "$distDir/src/Settings.xml"
          )
          $excludeDirs = @(
            "$distDir/src/Export",
            "$distDir/src/Builds",
            "$distDir/src/Data/TimelessJewelData/BrutalRestraint.bin",
            "$distDir/src/Data/TimelessJewelData/ElegantHubris.bin",
            "$distDir/src/Data/TimelessJewelData/GloriousVanity.bin",
            "$distDir/src/Data/TimelessJewelData/LethalPride.bin",
            "$distDir/src/Data/TimelessJewelData/MilitantFaith.bin"
          )
          foreach ($f in $excludeFiles) {
            if (Test-Path $f) { Remove-Item $f -Force }
          }
          foreach ($d in $excludeDirs) {
            if (Test-Path $d) { Remove-Item $d -Recurse -Force }
          }

          # Copy Korean data
          if (Test-Path "kor-db") {
            Copy-Item -Path "kor-db" -Destination "$distDir/kor-db" -Recurse -Force
          }

          # Copy root files
          @("changelog.txt", "help.txt", "LICENSE.md", "manifest.xml", "manifest.cfg") | ForEach-Object {
            if (Test-Path $_) { Copy-Item -Path $_ -Destination $distDir -Force }
          }

          # Create zip
          $zipName = "PathOfBuilding-kor-${version}-win64.zip"
          Compress-Archive -Path $distDir -DestinationPath $zipName -Force

          Write-Host "Created: $zipName"
          Get-ChildItem $zipName

      - name: Upload to release
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          $version = $tag -replace '^v', ''
          $zipName = "PathOfBuilding-kor-${version}-win64.zip"
          gh release upload $tag $zipName --clobber -R ${{ github.repository }}
