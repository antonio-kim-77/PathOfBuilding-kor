name: Create portable release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build'
        required: true
        default: 'v2.x.x'
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Build portable zip
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          $version = $tag -replace '^v', ''
          $distDir = "PathOfBuilding-kor-${version}"

          New-Item -ItemType Directory -Path $distDir -Force

          # Copy runtime (exe, dlls, SimpleGraphic/, lua/)
          Copy-Item -Path "runtime/*" -Destination $distDir -Recurse -Force

          # Rename exe: replace {space} with actual spaces
          Get-ChildItem "$distDir" -Filter "*{space}*" | ForEach-Object {
            $newName = $_.Name -replace '\{space\}', ' '
            Rename-Item $_.FullName $newName
          }

          # Copy source DIRECTLY into root (next to exe) for portable mode
          # PoB requires Launch.lua in same directory as the exe
          Copy-Item -Path "src/*" -Destination $distDir -Recurse -Force

          # Remove files not needed in distribution (per manifest.cfg)
          $excludeFiles = @(
            "$distDir/HeadlessWrapper.lua",
            "$distDir/LaunchInstall.lua",
            "$distDir/Settings.xml"
          )
          $excludeDirs = @(
            "$distDir/Export"
          )
          foreach ($f in $excludeFiles) {
            if (Test-Path $f) { Remove-Item $f -Force }
          }
          foreach ($d in $excludeDirs) {
            if (Test-Path $d) { Remove-Item $d -Recurse -Force }
          }

          # Copy Korean data
          if (Test-Path "kor-db") {
            Copy-Item -Path "kor-db" -Destination "$distDir/kor-db" -Recurse -Force
          }

          # Copy root files
          @("changelog.txt", "help.txt", "LICENSE.md", "manifest.xml", "manifest.cfg") | ForEach-Object {
            if (Test-Path $_) { Copy-Item -Path $_ -Destination $distDir -Force }
          }

          # Create zip
          $zipName = "PathOfBuilding-kor-${version}-win64.zip"
          Compress-Archive -Path $distDir -DestinationPath $zipName -Force

          Write-Host "Created: $zipName"
          Get-ChildItem $zipName

      - name: Upload to release
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          $version = $tag -replace '^v', ''
          $zipName = "PathOfBuilding-kor-${version}-win64.zip"
          gh release upload $tag $zipName --clobber -R ${{ github.repository }}
